spring.application.name=trilha-api

# Qual perfil carregar: dev (sua máquina), teste (online) ou producao.
# Sem a variável PERFIL, assume dev.
spring.profiles.active=${PERFIL:dev}

server.port=${PORT:8080}

# O banco é de responsabilidade do Flyway. O Hibernate só confere se as
# entidades batem com as tabelas — nunca cria nem altera nada sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# Fecha a conexão com o banco ao fim do service, não da requisição inteira.
spring.jpa.open-in-view=false
