# Perfil producao. Tudo vem de variável de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Em produção o Swagger fica desligado: ele lista todas as rotas da API
# para quem quiser ver. No dev e no teste continua ligado.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
